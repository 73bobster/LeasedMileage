<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LeasedMileage</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-shell">

  <div id="offline-banner" class="offline-banner hidden">
    You're offline — new readings will sync once you're back online
  </div>

  <!-- ================= AUTH SCREEN ================= -->
  <section id="screen-auth" class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo"><img src="icon.svg" alt="" /></div>
      <h2 class="auth-title">LeasedMileage</h2>
      <p class="auth-sub">Sign in to your household</p>

      <div class="segmented">
        <button id="tab-login" class="active" type="button">Log in</button>
        <button id="tab-register" type="button">Register</button>
      </div>

      <p id="auth-error" class="auth-error"></p>

      <div class="field">
        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" placeholder="name@email.com" />
      </div>
      <div class="field">
        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" placeholder="Password" />
      </div>

      <div id="household-picker" class="hidden">
        <div class="segmented">
          <button id="hh-new-tab" class="active" type="button">New household</button>
          <button id="hh-join-tab" type="button">Join with code</button>
        </div>
        <div id="hh-join-code" class="field hidden">
          <label for="hh-code-input">Household join code</label>
          <input id="hh-code-input" type="text" placeholder="e.g. 4F9A2C1B" />
        </div>
      </div>

      <button id="auth-submit" class="btn btn-primary btn-block" type="button" style="margin-top:6px;">Log in</button>
      <p class="auth-note">Uses the same login as Motoring Monitor</p>
    </div>
  </section>

  <!-- ================= MAIN SCREEN ================= -->
  <section id="screen-main" class="hidden">
    <div class="main-header">
      <div class="brand">
        <img src="icon.svg" alt="" />
        <h1>Your cars</h1>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <button id="add-car-btn" class="btn btn-ghost" type="button">
          <i class="ti ti-plus" aria-hidden="true"></i> Add car
        </button>
        <button id="logout-btn" class="icon-btn" type="button" aria-label="Log out">
          <i class="ti ti-logout" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div id="cars-list" class="cars-list"></div>
  </section>

  <!-- ================= ADD / EDIT VEHICLE SCREEN ================= -->
  <section id="screen-vehicle" class="hidden">
    <div class="vehicle-header">
      <button id="vehicle-back" class="icon-btn" type="button" aria-label="Back">
        <i class="ti ti-chevron-left" aria-hidden="true"></i>
      </button>
      <h2 id="vehicle-title">Add car</h2>
    </div>
    <div class="vehicle-form">
      <p id="vehicle-form-error" class="form-error"></p>

      <div class="field">
        <label for="vf-nickname">Nickname</label>
        <input id="vf-nickname" type="text" placeholder="Astra estate" />
      </div>
      <div class="field">
        <label for="vf-make">Make</label>
        <input id="vf-make" type="text" placeholder="Vauxhall" />
      </div>
      <div class="two-col">
        <div class="field">
          <label for="vf-term-start">Term start</label>
          <input id="vf-term-start" type="date" />
        </div>
        <div class="field">
          <label for="vf-term-end">Term end</label>
          <input id="vf-term-end" type="date" />
        </div>
      </div>
      <div class="field">
        <label for="vf-capped-miles">Capped miles</label>
        <input id="vf-capped-miles" type="number" inputmode="numeric" placeholder="30000" />
      </div>
      <div class="field">
        <label for="vf-cost-per-excess">Cost per excess mile (£)</label>
        <input id="vf-cost-per-excess" type="number" step="0.01" placeholder="0.09" />
      </div>
      <div class="field">
        <label for="vf-opening-mileage">Delivery miles</label>
        <input id="vf-opening-mileage" type="number" inputmode="numeric" placeholder="12" />
      </div>

      <button id="vehicle-save" class="btn btn-primary btn-block" type="button">Save car</button>
      <p class="auth-note">Ownership type is set to leased automatically</p>
      <p style="text-align:center; margin-top:16px;">
        <button id="vehicle-back-bottom" class="link-btn" type="button">&larr; Back to main page</button>
      </p>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
